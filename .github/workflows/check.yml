name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-0.1.7

      - name: Install
        run: |
          uv sync
          npm install --prefix kit
          npx --prefix kit playwright-core install chromium

      - name: App (access, voice upload, demo import, render)
        run: uv run python tests/check.py

      - name: Recording kit (minimal demo, end to end)
        env:
          DEMO_STUDIO_HOME: ${{ runner.temp }}/Demo Studio
          OUTPUT: ${{ runner.temp }}/minimal.mp4
        run: |
          node kit/examples/minimal.mjs
          test -s "$OUTPUT"
          test -s "$DEMO_STUDIO_HOME/demos/Minimal Demo/demo.json"

      - name: The app installs the way users install it
        run: uvx --from . demo-studio --help
