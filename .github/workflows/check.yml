name: check

# Manual only: macOS minutes count 10x on private repos. Run it from the Actions tab or `gh workflow run check`.
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-0.1.7

      - name: Install
        run: |
          uv sync
          # cd, not --prefix: on Windows npm looks for package.json in the repo root with --prefix.
          (cd kit && npm install && npx playwright-core install chromium)

      - name: App (access, voice upload, demo import, render)
        # GitHub's macOS runners give the GPU too little memory for the voice model ("MPS backend out of memory").
        env:
          DEMO_STUDIO_DEVICE: ${{ runner.os == 'macOS' && 'cpu' || '' }}
        run: uv run python tests/check.py

      - name: Recording kit (minimal demo, end to end)
        env:
          DEMO_STUDIO_HOME: ${{ runner.temp }}/Demo Studio
          OUTPUT: ${{ runner.temp }}/minimal.mp4
        run: |
          node kit/examples/minimal.mjs
          test -s "$OUTPUT"
          test -s "$DEMO_STUDIO_HOME/demos/Minimal Demo/demo.json"

      - name: The app installs the way users install it
        run: uvx --from . demo-studio --help
