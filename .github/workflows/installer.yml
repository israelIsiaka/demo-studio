# Builds DemoStudio-Setup.exe and then proves it works by installing it and
# launching the app, because an installer that has never been run is a guess.
name: installer

on:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: Release tag holding the LGPL ffmpeg build
        default: "ffmpeg-7.1.1"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # uv fetches Python and the libraries on the user's machine; shipping it
      # is what keeps the installer small.
      - name: fetch uv
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o uv.zip https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip
          unzip -j uv.zip uv.exe -d installer/
          installer/uv.exe --version

      - name: fetch our LGPL ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.ffmpeg_tag }}" -p "ffmpeg-windows-x64.exe" -O installer/ffmpeg.exe
          # Refuse to ship a binary carrying GPL or nonfree code - the whole
          # reason we build our own.
          conf=$(installer/ffmpeg.exe -version | grep -o 'configuration:.*')
          for bad in enable-gpl enable-nonfree enable-libx264; do
            case "$conf" in *"--$bad"*) echo "REFUSING: ffmpeg has --$bad"; exit 1;; esac
          done
          echo "ffmpeg is LGPL only"
          # And that it runs on a clean machine. This runner has MSYS2 on it, so
          # a binary needing libwinpthread-1.dll starts here and fails on a real
          # user's desktop - which is exactly what shipped the first time.
          for dll in $(objdump -p installer/ffmpeg.exe 2>/dev/null | awk '/DLL Name:/ {print tolower($3)}' | sort -u); do
            case "$dll" in
              libwinpthread*|libgcc*|libstdc*|*msys*)
                echo "REFUSING: ffmpeg needs $dll, which a user will not have"; exit 1;;
            esac
          done
          echo "ffmpeg is self-contained"

      - name: build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DemoStudio.iss /O"${{ github.workspace }}\dist"
          Get-ChildItem dist

      # The real check: install it the way a user would, silently, then start
      # the app and see whether it answers. The app gates every request on a
      # one-time token and prints its address with that token on stdout, so the
      # test has to read the address rather than guess the port.
      - name: install it and start the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\DemoStudio-Setup.exe
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          $app = "$env:LOCALAPPDATA\Programs\Demo Studio"
          if (-not (Test-Path "$app\.venv")) { throw "install did not build the Python environment" }
          if (-not (Test-Path "$env:USERPROFILE\Demo Studio\bin\ffmpeg.exe")) { throw "ffmpeg was not put where render.py looks" }
          if (-not (Test-Path "$app\launch.vbs")) { throw "the launcher is missing" }
          # This runner has long paths switched on; a home PC does not, and there
          # Python cannot open any file whose full path is 260 characters or more.
          $long = Get-ChildItem -LiteralPath $app -Recurse -File -Force | Sort-Object { $_.FullName.Length } | Select-Object -Last 1
          Write-Host "longest installed path: $($long.FullName.Length) characters ($($long.FullName))"
          if ($long.FullName.Length -ge 240) { throw "installed paths come too close to the 260-character limit of a normal Windows PC" }

          $out = "$env:TEMP\ds-out.txt"
          $err = "$env:TEMP\ds-err.txt"
          $proc = Start-Process -FilePath "$app\tools\uv.exe" -ArgumentList "run","--frozen","--no-dev","demo-studio" `
                    -WorkingDirectory $app -RedirectStandardOutput $out -RedirectStandardError $err `
                    -PassThru -WindowStyle Hidden
          $url = $null
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 2
            if (Test-Path $out) {
              $text = Get-Content $out -Raw -ErrorAction SilentlyContinue
              if ($text -match "http://127\.0\.0\.1:\d+/\?t=[\w\-]+") { $url = $Matches[0]; break }
            }
            if ($proc.HasExited) { break }
          }
          if (-not $url) {
            Write-Host "--- stdout ---"; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content $err -ErrorAction SilentlyContinue
            throw "the app never printed its address"
          }
          $r = Invoke-WebRequest $url -TimeoutSec 15 -UseBasicParsing
          if ($r.Content -notmatch "Demo Studio") { throw "the app answered but did not serve its page" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "installed, launched, and serving at $($url -replace '\?t=.*', '?t=<hidden>')"

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="app-v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2 || echo 0.1.0)"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Demo Studio $tag" --notes "Windows installer. Double-click and follow it; everything else is automatic." \
            || true
          gh release upload "$tag" dist/DemoStudio-Setup.exe --clobber
