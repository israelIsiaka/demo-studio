[project]
name = "demo-studio"
version = "0.1.0"
description = "Narrate product demo videos in your own voice, entirely on your own computer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chatterbox-tts==0.1.7",
  "imageio-ffmpeg>=0.5",
  # resemble-perth (Chatterbox's watermark) still imports pkg_resources, which newer setuptools dropped.
  "setuptools<81",
]

[project.scripts]
demo-studio = "demo_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_studio"]
